name: studyverse
description: AI 공부 인증 & 리워드 플랫폼 - StudyVerse
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.0

  # Data / Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0

  # Firebase (real backend: Auth + Firestore) — matched 2.32 release train
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  firebase_analytics: ^10.10.7
  firebase_crashlytics: ^3.5.7

  # Social sign-in
  google_sign_in: ^6.2.1

  # Sharing & local notifications
  share_plus: ^7.2.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Ads (Google AdMob)
  google_mobile_ads: ^5.1.0

  # Keep screen awake during study/pomodoro
  wakelock_plus: ^1.2.5

  # Royalty-free focus music / noise player
  audioplayers: ^5.2.1

  # Storage (community photo attachments)
  firebase_storage: ^11.7.7

  # Camera & ML
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.9.0
  image_picker: ^1.0.7


  # Permissions & Auth
  permission_handler: ^11.1.0
  local_auth: ^2.1.8

  # UI / Animations
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  shimmer: ^3.0.0
  gap: ^3.0.1
  auto_size_text: ^3.0.0

  # Charts
  fl_chart: ^0.66.2

  # Calendar
  table_calendar: ^3.0.9

  # Internationalization
  intl: ^0.19.0

  # Utilities
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  custom_lint: ^0.5.0
  riverpod_lint: ^2.3.0
  hive_generator: ^2.0.1

# Pin native plugins to versions compiled with Kotlin 1.9.x / AGP 8.2 so the
# release APK builds on this Flutter channel. wakelock_plus 1.4.x and the
# package_info_plus 9.x it pulls are compiled with Kotlin 2.x, whose module
# metadata is unreadable by the project's Kotlin 1.9.22 → assembleRelease fails.
dependency_overrides:
  wakelock_plus: 1.2.8
  package_info_plus: 8.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/audio/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
