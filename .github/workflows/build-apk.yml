name: Build StudyVerse APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # ── 4. Create local.properties with SDK paths ────────────────────────
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.buildMode=debug" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      # ── 5. Create missing asset dirs (required by pubspec) ────────────────
      - name: Create asset directories
        run: |
          mkdir -p assets/images assets/animations assets/icons assets/fonts
          # Create dummy font files so pubspec validation passes
          touch assets/fonts/Pretendard-Regular.ttf
          touch assets/fonts/Pretendard-Medium.ttf
          touch assets/fonts/Pretendard-SemiBold.ttf
          touch assets/fonts/Pretendard-Bold.ttf
          touch assets/fonts/Pretendard-ExtraBold.ttf
          # Create a dummy image so asset bundle isn't empty
          touch assets/images/.gitkeep
          touch assets/animations/.gitkeep
          touch assets/icons/.gitkeep

      # ── 5. Download Pretendard fonts ──────────────────────────────────────
      - name: Download Pretendard fonts
        run: |
          FONT_BASE="https://github.com/orioncactus/pretendard/releases/download/v1.3.9"
          curl -L "$FONT_BASE/Pretendard-1.3.9.zip" -o /tmp/pretendard.zip
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Regular.ttf" -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Medium.ttf"  -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-SemiBold.ttf" -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Bold.ttf"    -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-ExtraBold.ttf" -d assets/fonts/ || true
          echo "Fonts prepared:"
          ls -lh assets/fonts/

      # ── 6. Create google-services.json placeholder ────────────────────────
      - name: Create Firebase placeholder config
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "studyverse-placeholder",
              "storage_bucket": "studyverse-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.studyverse.app"
                  }
                },
                "api_key": [{ "current_key": "placeholder-api-key" }],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # ── 7. Flutter pub get ────────────────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ── 8. Run code generation ────────────────────────────────────────────
      - name: Run build_runner
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      # ── 9. Analyze (non-blocking) ─────────────────────────────────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos || true

      # ── 10a. Build DEBUG APK ──────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          flutter build apk --debug \
            --dart-define=FLUTTER_APP_VERSION=${{ github.ref_name }} \
            --no-pub
          echo "APK_PATH=build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_ENV

      # ── 10b. Build RELEASE APK ────────────────────────────────────────────
      - name: Build release APK (unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=FLUTTER_APP_VERSION=${{ github.ref_name }} \
            --no-pub
          echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_ENV

      # ── 11. Show APK info ─────────────────────────────────────────────────
      - name: Show APK info
        run: |
          echo "=== APK Files ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;
          echo "=== Build complete ==="

      # ── 12. Upload APK artifact ───────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyverse-apk-${{ github.event.inputs.build_type || 'debug' }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ── AAB Build (for Play Store) ────────────────────────────────────────────
  build-aab:
    name: Build App Bundle (AAB)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Create asset directories
        run: |
          mkdir -p assets/images assets/animations assets/icons assets/fonts
          touch assets/fonts/Pretendard-Regular.ttf
          touch assets/fonts/Pretendard-Medium.ttf
          touch assets/fonts/Pretendard-SemiBold.ttf
          touch assets/fonts/Pretendard-Bold.ttf
          touch assets/fonts/Pretendard-ExtraBold.ttf

      - name: Download Pretendard fonts
        run: |
          curl -L "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip" -o /tmp/pretendard.zip
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Regular.ttf"   -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Medium.ttf"    -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-SemiBold.ttf"  -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Bold.ttf"      -d assets/fonts/ || true
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-ExtraBold.ttf" -d assets/fonts/ || true

      - name: Create Firebase placeholder config
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "studyverse-placeholder",
              "storage_bucket": "studyverse-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.studyverse.app" }
                },
                "api_key": [{ "current_key": "placeholder-api-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=FLUTTER_APP_VERSION=${{ github.ref_name }} \
            --no-pub

      - name: Show AAB info
        run: find build/app/outputs -name "*.aab" -exec ls -lh {} \;

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyverse-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 90
