name: Build StudyVerse APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Release AOT)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Fix Pretendard fonts (ensure real TTF files from correct zip path)
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip" -o /tmp/pretendard.zip
          # Fonts are in public/static/alternative/ (NOT public/static/)
          unzip -o -j /tmp/pretendard.zip \
            "public/static/alternative/Pretendard-Regular.ttf" \
            "public/static/alternative/Pretendard-Medium.ttf" \
            "public/static/alternative/Pretendard-SemiBold.ttf" \
            "public/static/alternative/Pretendard-Bold.ttf" \
            "public/static/alternative/Pretendard-ExtraBold.ttf" \
            -d assets/fonts/
          echo "Font sizes:"
          ls -lh assets/fonts/

      # google-services.json (real Firebase config) is committed in the repo —
      # no placeholder generation needed.

      - name: Flutter pub get
        run: flutter pub get

      - name: Set up release signing key (for stable Google Sign-In SHA-1)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/studyverse.keystore
            cat > android/keystore.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=studyverse.keystore
          EOF
            echo "Release keystore configured."
          else
            echo "No KEYSTORE_BASE64 secret set — using default debug signing."
          fi

      - name: Patch plugin compileSdkVersion to 35
        run: |
          # Fixes "resource android:attr/lStar not found" in google_mlkit_commons.
          # Some plugins ship with compileSdkVersion < 31 but reference Material-3
          # attributes (lStar) via transitive AARs. Force API 35 for all plugins.
          find "$HOME/.pub-cache/hosted" -name "build.gradle" -path "*/android/*" \
            -exec grep -l "compileSdkVersion" {} \; \
            | xargs sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' || true
          echo "Plugin compileSdkVersion patched to 35"

      - name: Build runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK (AOT — no JIT crash)
        run: |
          flutter build apk --release --no-pub
          echo "Built: $(ls -lh build/app/outputs/flutter-apk/app-release.apk)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyVerse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: APK summary
        run: |
          echo "## ✅ Release APK 빌드 완료 (AOT 컴파일)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 설치 방법" >> $GITHUB_STEP_SUMMARY
          echo "1. 기존 앱 **완전 삭제** (중요!)" >> $GITHUB_STEP_SUMMARY
          echo "2. 이 페이지 **Summary** 탭 → **Artifacts** → **StudyVerse-release-apk** 다운로드" >> $GITHUB_STEP_SUMMARY
          echo "3. APK 설치" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SIZE=$(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}')
          echo "**APK 크기:** $SIZE" >> $GITHUB_STEP_SUMMARY

  build-admin-web:
    name: Build Admin Web Panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fix Pretendard fonts
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip" -o /tmp/pretendard.zip
          unzip -o -j /tmp/pretendard.zip \
            "public/static/alternative/Pretendard-Regular.ttf" \
            "public/static/alternative/Pretendard-Medium.ttf" \
            "public/static/alternative/Pretendard-SemiBold.ttf" \
            "public/static/alternative/Pretendard-Bold.ttf" \
            "public/static/alternative/Pretendard-ExtraBold.ttf" \
            -d assets/fonts/

      - name: Flutter pub get
        run: flutter pub get

      - name: Build admin web (Flutter Web — PC + 모바일 브라우저)
        run: |
          flutter build web --release \
            -t lib/admin/admin_main.dart \
            --base-href /studyverse-admin/
          echo "Built admin web at build/web"

      - name: Upload admin web
        uses: actions/upload-artifact@v4
        with:
          name: StudyVerse-admin-web
          path: build/web
          retention-days: 30
          if-no-files-found: error

      - name: Admin web summary
        run: |
          echo "## ✅ 관리자 웹 패널 빌드 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**StudyVerse-admin-web** 아티팩트를 다운로드해 정적 호스팅" >> $GITHUB_STEP_SUMMARY
          echo "(Firebase Hosting / Netlify / GitHub Pages 등)하면" >> $GITHUB_STEP_SUMMARY
          echo "PC·모바일 브라우저에서 접속할 수 있습니다." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ 접속 전 web/index.html의 firebaseConfig를 실제 값으로 교체하세요." >> $GITHUB_STEP_SUMMARY
