name: Build StudyVerse APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Release AOT)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Fix Pretendard fonts (ensure real TTF files from correct zip path)
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip" -o /tmp/pretendard.zip
          # Fonts are in public/static/alternative/ (NOT public/static/)
          unzip -o -j /tmp/pretendard.zip \
            "public/static/alternative/Pretendard-Regular.ttf" \
            "public/static/alternative/Pretendard-Medium.ttf" \
            "public/static/alternative/Pretendard-SemiBold.ttf" \
            "public/static/alternative/Pretendard-Bold.ttf" \
            "public/static/alternative/Pretendard-ExtraBold.ttf" \
            -d assets/fonts/
          echo "Font sizes:"
          ls -lh assets/fonts/

      - name: Create Firebase config (placeholder for CI)
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "studyverse-placeholder",
              "storage_bucket": "studyverse-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.studyverse.app" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": { "package_name": "com.studyverse.app.debug" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:2222222222222222",
                  "android_client_info": { "package_name": "com.studyverse.app.profile" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK (AOT — no JIT crash)
        run: |
          flutter build apk --release --no-pub
          echo "Built: $(ls -lh build/app/outputs/flutter-apk/app-release.apk)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyVerse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: APK summary
        run: |
          echo "## ✅ Release APK 빌드 완료 (AOT 컴파일)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 설치 방법" >> $GITHUB_STEP_SUMMARY
          echo "1. 기존 앱 **완전 삭제** (중요!)" >> $GITHUB_STEP_SUMMARY
          echo "2. 이 페이지 **Summary** 탭 → **Artifacts** → **StudyVerse-release-apk** 다운로드" >> $GITHUB_STEP_SUMMARY
          echo "3. APK 설치" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SIZE=$(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}')
          echo "**APK 크기:** $SIZE (debug 대비 ~60% 작음)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ℹ️ 이전 대비 개선점" >> $GITHUB_STEP_SUMMARY
          echo "- Debug→Release: AOT 컴파일, JIT 없음 (SELinux 크래시 방지)" >> $GITHUB_STEP_SUMMARY
          echo "- 폰트 경로 수정: 실제 TTF 파일 정확히 추출" >> $GITHUB_STEP_SUMMARY
