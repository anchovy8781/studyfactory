name: Build StudyVerse APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Download Pretendard fonts
        run: |
          mkdir -p assets/fonts assets/images assets/animations assets/icons
          curl -fsSL "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip" -o /tmp/pretendard.zip
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Regular.ttf"   -d assets/fonts/ || touch assets/fonts/Pretendard-Regular.ttf
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Medium.ttf"    -d assets/fonts/ || touch assets/fonts/Pretendard-Medium.ttf
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-SemiBold.ttf"  -d assets/fonts/ || touch assets/fonts/Pretendard-SemiBold.ttf
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-Bold.ttf"      -d assets/fonts/ || touch assets/fonts/Pretendard-Bold.ttf
          unzip -j /tmp/pretendard.zip "*/public/static/Pretendard-ExtraBold.ttf" -d assets/fonts/ || touch assets/fonts/Pretendard-ExtraBold.ttf

      - name: Create Firebase config
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "studyverse-placeholder",
              "storage_bucket": "studyverse-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.studyverse.app" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": { "package_name": "com.studyverse.app.debug" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:2222222222222222",
                  "android_client_info": { "package_name": "com.studyverse.app.profile" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        run: |
          flutter build apk --debug --no-pub
          echo "Built: $(ls -lh build/app/outputs/flutter-apk/app-debug.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVerse-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: APK download link summary
        run: |
          echo "## ✅ APK 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 다운로드 방법" >> $GITHUB_STEP_SUMMARY
          echo "1. 이 페이지 상단 **Summary** 탭 클릭" >> $GITHUB_STEP_SUMMARY
          echo "2. 하단 **Artifacts** 섹션에서 **StudyVerse-debug-apk** 클릭" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SIZE=$(ls -lh build/app/outputs/flutter-apk/app-debug.apk | awk '{print $5}')
          echo "**APK 크기:** $SIZE" >> $GITHUB_STEP_SUMMARY
